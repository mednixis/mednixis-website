*{margin:0;padding:0;box-sizing:border-box}
:root{
 --navy:#141D2C;--navy2:#1B2434;--copper:#B0793F;--copper2:#C9955C;
 --bg:#F3F4F7;--card:#fff;--line:#E7E9EF;--ink:#232B3A;--mut:#8A94A6;
 --green:#2F9E63;--greenbg:#E6F5EC;--greentx:#237A4B;

body{font-family:'Segoe UI',-apple-system,'DejaVu Sans',sans-serif;background:var(--bg);color:var(--ink);font-size:14px;-webkit-font-smoothing:antialiased}
button{font-family:inherit;border:none;background:none;cursor:pointer;font-size:inherit;color:inherit}
input{font-family:inherit;font-size:13px}

/* demo banner */
.banner{background:linear-gradient(90deg,#1B2434,#2A3650);color:#fff;padding:10px 22px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.banner .b-pill{background:var(--copper);color:#fff;font-size:11px;font-weight:700;letter-spacing:.1em;padding:5px 12px;border-radius:999px}
.banner .b-t{font-size:13px;opacity:.9}
.banner a{margin-left:auto;color:var(--copper2);font-size:13px;font-weight:600;text-decoration:none}
.banner a:hover{text-decoration:underline}

.app{display:flex;min-height:calc(100vh - 42px)}
/* sidebar */
.side{width:232px;background:var(--navy);color:#A9B4C6;display:flex;flex-direction:column;flex-shrink:0}
.brand{display:flex;align-items:center;gap:12px;padding:20px;border-bottom:1px solid rgba(255,255,255,.07)}
.mono{width:40px;height:40px;border-radius:10px;background:linear-gradient(135deg,#C9955C,#B0793F);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:16px;flex-shrink:0}
.brand .t1{color:#fff;font-weight:600;font-size:14.5px}
.brand .t2{font-size:10.5px;color:#8A96A9;letter-spacing:.08em;text-transform:uppercase}
.menu{padding:12px;flex:1}
.mi{display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:9px;margin-bottom:3px;font-size:13.5px;color:#A9B4C6;width:100%;text-align:left;transition:background .15s}
.mi:hover{background:rgba(255,255,255,.05);color:#fff}
.mi svg{width:17px;height:17px;stroke:#7E8BA0;fill:none;stroke-width:1.8;flex-shrink:0}
.mi.on{background:rgba(201,149,92,.14);color:#fff;position:relative}
.mi.on::before{content:"";position:absolute;left:-12px;top:8px;bottom:8px;width:3px;border-radius:3px;background:var(--copper2)}
.mi.on svg{stroke:var(--copper2)}
.mi.hidden{display:none}
.side-foot{padding:14px 20px;border-top:1px solid rgba(255,255,255,.07);font-size:11px;color:#68758B;line-height:1.7}
.side-foot b{color:var(--copper2)}

/* main */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.top{height:62px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 22px;flex-shrink:0}
.crumb{font-size:15px;font-weight:600;color:var(--navy2);white-space:nowrap}
.crumb span{color:#98A1B2;font-weight:400}
.rolebox{margin-left:auto;display:flex;align-items:center;gap:9px;background:#F3F4F7;border:1px solid var(--line);border-radius:999px;padding:5px 6px 5px 14px}
.rolebox .lb{font-size:11.5px;color:var(--mut);font-weight:600;letter-spacing:.04em;white-space:nowrap}
.rb{padding:7px 13px;border-radius:999px;font-size:12px;font-weight:600;color:#5C6675;white-space:nowrap}
.rb.on{background:var(--navy2);color:#fff}
.avatar{display:flex;align-items:center;gap:10px}
.av{width:34px;height:34px;border-radius:50%;background:var(--navy2);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:600}
.who{line-height:1.2}
.who .n{font-size:13px;font-weight:600;white-space:nowrap}
.who .r{font-size:11px;color:var(--mut)}
.content{padding:24px;flex:1;overflow-x:auto}

/* generic */
.h-row{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:18px;flex-wrap:wrap}
.h1{font-size:19px;font-weight:700;color:var(--navy2)}
.sub{font-size:13px;color:#7A8496;margin-top:2px}
.btnp{background:var(--copper);color:#fff;border-radius:9px;padding:10px 18px;font-size:13px;font-weight:600;transition:background .15s}
.btnp:hover{background:var(--copper2)}
.btns{background:#fff;border:1px solid #E0E3EA;color:#3A4353;border-radius:9px;padding:9px 15px;font-size:13px;font-weight:500}
.btns:hover{border-color:var(--copper);color:var(--copper)}
.card{background:var(--card);border:1px solid var(--line);border-radius:13px;overflow:hidden}
.pad{padding:18px 20px}
.grid{display:grid;gap:16px}
.pill{display:inline-block;padding:4px 11px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap}
.p-green{background:var(--greenbg);color:var(--greentx)}
.p-amber{background:var(--amberbg);color:var(--ambertx)}
.p-blue{background:var(--bluebg);color:var(--bluetx)}
.p-red{background:var(--redbg);color:var(--redtx)}
.p-gray{background:var(--graybg);color:var(--graytx)}
.p-navy{background:#E3E7EF;color:var(--navy2)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);font-weight:600;padding:11px 15px;border-bottom:1px solid var(--line);background:#FAFBFC;white-space:nowrap}
td{padding:12px 15px;border-bottom:1px solid #F0F2F5;color:#2B3446;vertical-align:middle}
tr:last-child td{border-bottom:none}
.tick{color:var(--green);font-weight:700}
.mut{color:var(--mut)}
.kpi{padding:16px 18px}
.kpi .lb{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--mut);font-weight:600}
.kpi .v{font-size:25px;font-weight:700;color:var(--navy2);margin-top:6px}
.kpi .d{font-size:12px;margin-top:4px;color:var(--mut)}
.up{color:var(--green);font-weight:600}
.sec-t{font-size:14px;font-weight:700;color:var(--navy2)}
.tabbar{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.tabb{padding:8px 15px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:12.5px;font-weight:500;color:var(--navy2)}
.tabb.on{background:var(--navy2);border-color:var(--navy2);color:#fff}
.searchin{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 14px;background:#fff;color:var(--ink);outline:none}
.searchin:focus{border-color:var(--copper)}
.bar-wrap{height:9px;background:var(--graybg);border-radius:9px;overflow:hidden}
.bar{height:9px;border-radius:9px}
/* switch */
.sw{width:38px;height:22px;border-radius:999px;background:#D7DBE3;position:relative;transition:background .18s;flex-shrink:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .18s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw.on{background:var(--green)}
.sw.on::after{left:19px}
/* toast */
.toasts{position:fixed;bottom:22px;right:22px;z-index:200;display:flex;flex-direction:column;gap:10px}
.toast{background:var(--navy2);color:#fff;border-radius:11px;padding:13px 18px;font-size:13px;box-shadow:0 14px 40px rgba(19,26,39,.35);display:flex;gap:10px;align-items:center;animation:tin .25s ease;max-width:340px}
.toast .tk{color:#7ED9A4;font-weight:700}
@keyframes tin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.fade{animation:fadein .3s ease}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* wa preview */
.wa-shell{background:#E8E2D9;border-radius:13px;overflow:hidden;border:1px solid var(--line)}
.wa-head{background:#0F5C4E;color:#fff;padding:13px 17px;display:flex;align-items:center;gap:12px}
.wa-av{width:33px;height:33px;border-radius:50%;background:var(--copper2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}
.wa-body{padding:20px 16px}
.wa-msg{background:#fff;border-radius:12px;border-top-left-radius:3px;padding:13px 15px;font-size:13px;line-height:1.75;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.wa-time{text-align:right;font-size:11px;color:var(--mut);margin-top:6px}
/* steps */
.stepbar{display:flex;gap:6px;margin:14px 0 18px;flex-wrap:wrap}
.step{padding:7px 13px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--graybg);color:var(--graytx)}
.step.done{background:var(--greenbg);color:var(--greentx)}
.step.on{background:var(--copper);color:#fff}
.fieldbox{border:1px solid var(--line);border-radius:10px;padding:13px 15px}
.fieldbox .fl{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);margin-bottom:6px;font-weight:600}
.notebox{border:1px dashed #DCC8AE;background:#FDF9F2}
.rowclick{cursor:pointer}
.rowclick:hover td{background:#FAFBFD}
.rowsel td{background:#FDF9F2!important}
.lockmsg{padding:60px 30px;text-align:center;color:var(--mut)}
.lockmsg .li{font-size:36px;margin-bottom:12px}
.lockmsg b{color:var(--navy2)}
@media(max-width:980px){

 .content{padding:14px}
 .g4{grid-template-columns:1fr 1fr!important}

}

function renderMenu(){

 $('#menu').innerHTML=MODULES.map(m=>{

  return `<button class="mi ${state.mod===m.id?'on':''} ${ok?'':'hidden'}" data-mod="${m.id}">${IC[m.icon]}<span>${m.label}</span></button>`;

 document.querySelectorAll('[data-mod]').forEach(b=>b.onclick=()=>{state.mod=b.dataset.mod;render();});
}
function render(){

 <div class="h-row"><div><div class="h1">Team & Access Control</div><div class="sub">Each role sees exactly what it needs — try the "View as" switcher in the top bar and watch the sidebar change</div></div><button class="btnp">+ Invite User</button></div>
 <div class="grid g12" style="grid-template-columns:1fr 1.25fr">
  <div class="card"><div class="pad" style="padding-bottom:6px"><span class="sec-t">Users</span></div>
  <table><tr><th>Name</th><th>Role</th><th>Last Active</th></tr>
  <tr><td><b>Moustafa Ragab</b></td><td><span class="pill p-navy">Owner</span></td><td class="mut">Now</td></tr>
  <tr><td><b>Prof. Maged Ragab</b></td><td><span class="pill p-blue">Doctor</span></td><td class="mut">2h ago</td></tr>
  <tr><td><b>Mona Adel</b></td><td><span class="pill p-green">Secretary</span></td><td class="mut">Now</td></tr>
  <tr><td><b>Sara Mostafa</b></td><td><span class="pill p-green">Secretary</span></td><td class="mut">Yesterday</td></tr>
  <tr><td><b>Nour Hany</b></td><td><span class="pill p-amber">Content Editor</span></td><td class="mut">3d ago</td></tr></table></div>
  <div class="card"><div class="pad" style="padding-bottom:6px"><span class="sec-t">Permission Matrix</span></div>
  <table><tr><th>Module</th><th style="text-align:center">Owner</th><th style="text-align:center">Doctor</th><th style="text-align:center">Secretary</th><th style="text-align:center">Editor</th></tr>
  ${mods.map(m=>`<tr><td><b>${m[0]}</b></td>${cell(m[1])}${cell(m[2])}${cell(m[3])}${cell(m[4])}</tr>`).join('')}</table></div>
 </div>`;
}
};

/* ============ WIRING ============ */
function wire(){
 document.querySelectorAll('[data-cf]').forEach(b=>b.onclick=()=>{state.clinicFilter=b.dataset.cf;render();});
 document.querySelectorAll('[data-sf]').forEach(b=>b.onclick=()=>{state.surgFilter=b.dataset.sf;render();});
 document.querySelectorAll('[data-confirm]').forEach(b=>b.onclick=()=>{
  const bk=BOOKINGS[+b.dataset.confirm];bk.st='Confirmed';bk.wa=true;render();
  toast(`WhatsApp confirmation sent to <b>${bk.n.split(' ').slice(0,2).join(' ')}</b> — template booking_confirm_ar`);});
 document.querySelectorAll('[data-pat]').forEach(r=>r.onclick=()=>{if(state.role==='secretary')return;state.selPatient=+r.dataset.pat;state.patStep=3;render();});
 document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{state.patStep=+b.dataset.step;render();});
 document.querySelectorAll('[data-wa]').forEach(b=>b.onclick=()=>{const w=WA[+b.dataset.wa];w.on=!w.on;render();
  toast(`${w.n} flow ${w.on?'activated':'paused'}`);});
 document.querySelectorAll('[data-cms]').forEach(b=>b.onclick=()=>{const c=CMS[+b.dataset.cms];c.pub=!c.pub;render();
  toast(`"${c.t}" ${c.pub?'published to drmagedragab.com':'moved to drafts'}`);});
 const q=$('#patQ');if(q){q.oninput=e=>{state.patSearch=e.target.value;
  const pos=e.target.selectionStart;render();const nq=$('#patQ');nq.focus();nq.setSelectionRange(pos,pos);};}
 const sv=$('#saveRec');if(sv)sv.onclick=()=>toast('Record saved — visit history updated');
 const pr=$('#printRec');if(pr)pr.onclick=()=>toast('Printable sheet generated (demo)');
 const nb=$('#newBk');if(nb)nb.onclick=()=>toast('In the live system this opens the booking form — with slot validation per clinic');
 const rp=$('#recPay');if(rp)rp.onclick=()=>toast('In the live system this records a payment against a visit');
 const pb=$('#perBtn');if(pb)pb.onclick=()=>{state.reportPeriod=state.reportPeriod==='jul'?'q2':'jul';render();toast('Reporting period switched');};
 const cb=$('#csvBtn');if(cb)cb.onclick=()=>toast('CSV export ready for accounting (demo)');
}
document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{
 document.querySelectorAll('[data-role]').forEach(x=>x.classList.remove('on'));b.classList.add('on');
 state.role=b.dataset.role;render();
 const msgs={owner:'Viewing as <b>Owner</b> — full access to every module',
 doctor:'Viewing as <b>Doctor</b> — clinical modules only, payments hidden',
 secretary:'Viewing as <b>Secretary</b> — scheduling & payments, limited medical records',
 editor:'Viewing as <b>Content Editor</b> — website content only'};
 toast(msgs[state.role]);
});
render();
</script>
</body>
</html>
